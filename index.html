<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Home Automation Simulation - Blynk Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #121824;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-container {
            width: 360px;
            height: 720px;
            background: #1a2233;
            border-radius: 40px;
            border: 8px solid #2d3748;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Status Bar */
        .status-bar {
            background: #0f141d;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #a0aec0;
            font-weight: 600;
        }

        /* App Header */
        .app-header {
            background: #0e1626;
            padding: 15px 20px;
            border-bottom: 1px solid #2a3447;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title h2 {
            font-size: 18px;
            color: #ffffff;
            font-weight: 600;
        }

        .app-title span {
            font-size: 11px;
            color: #48bb78;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .wifi-icon {
            color: #48bb78;
            font-size: 16px;
        }

        /* App Body / Dashboard Grid */
        .dashboard-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .dashboard-body::-webkit-scrollbar {
            width: 4px;
        }
        .dashboard-body::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 4px;
        }

        /* Widget Card */
        .widget-card {
            background: #222b3c;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .widget-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e0;
        }

        .widget-header .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #718096;
            transition: 0.3s;
        }
        .widget-header .indicator.active {
            background: #48bb78;
            box-shadow: 0 0 8px #48bb78;
        }

        /* Fan Visualizer Widget */
        .fan-visual-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fan-center {
            width: 24px;
            height: 24px;
            background: #4a5568;
            border-radius: 50%;
            z-index: 2;
        }

        .fan-blade {
            position: absolute;
            width: 12px;
            height: 60px;
            background: #3182ce;
            border-radius: 6px;
            top: 10px;
            transform-origin: center;
        }

        .blade-1 { transform: rotate(0deg); }
        .blade-2 { transform: rotate(120deg); }
        .blade-3 { transform: rotate(240deg); }

        /* Rotation Speed classes controlled via JS */
        .spinning-1 { animation: spin 1.5s linear infinite; }
        .spinning-2 { animation: spin 0.9s linear infinite; }
        .spinning-3 { animation: spin 0.5s linear infinite; }
        .spinning-4 { animation: spin 0.3s linear infinite; }
        .spinning-5 { animation: spin 0.15s linear infinite; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Fan Speed Regulator Slider */
        .regulator-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aec0;
        }

        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #141b2d;
            outline: none;
            transition: background 0.3s;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #3182ce;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(49, 130, 206, 0.8);
            transition: transform 0.1s;
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* Switch Toggle Widget */
        .switch-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .switch-label {
            display: flex;
            flex-direction: column;
        }

        .switch-label span:first-child {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .switch-label span:last-child {
            font-size: 11px;
            color: #a0aec0;
        }

        /* Toggle Button UI */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #141b2d;
            transition: .3s;
            border-radius: 28px;
            border: 1px solid #2d3748;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: #a0aec0;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider-toggle {
            background-color: #48bb78;
            border-color: #38a169;
        }

        input:checked + .slider-toggle:before {
            transform: translateX(24px);
            background-color: white;
        }

        /* Metrics Row */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .metric-box {
            background: #222b3c;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #2d3748;
            text-align: center;
        }

        .metric-box h4 {
            font-size: 11px;
            color: #a0aec0;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .metric-box p {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        /* App Footer Brand */
        .app-footer {
            background: #0f141d;
            padding: 10px;
            text-align: center;
            font-size: 10px;
            color: #718096;
            border-top: 1px solid #1a2233;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41 AM</span>
            <span>5G &nbsp; 89%</span>
        </div>

        <!-- App Header -->
        <div class="app-header">
            <div class="app-title">
                <h2>IoT Home Automation</h2>
                <span>● DEVICE: ONLINE</span>
            </div>
            <div class="wifi-icon">📶</div>
        </div>

        <!-- Dashboard Body -->
        <div class="dashboard-body">

            <!-- Ceiling Fan Control Card -->
            <div class="widget-card">
                <div class="widget-header">
                    <span>Ceiling Fan Regulator</span>
                    <div class="indicator" id="fanIndicator"></div>
                </div>

                <!-- Fan Visual Simulation -->
                <div class="fan-visual-container" id="fanVisual">
                    <div class="fan-blade blade-1" id="b1"></div>
                    <div class="fan-blade blade-2" id="b2"></div>
                    <div class="fan-blade blade-3" id="b3"></div>
                    <div class="fan-center"></div>
                </div>

                <!-- Regulator Slider -->
                <div class="regulator-container">
                    <div class="slider-label-row">
                        <span>Speed Level: <strong id="speedValue" style="color: #3182ce;">0</strong></span>
                        <span>Max: 5</span>
                    </div>
                    <input type="range" min="0" max="5" value="0" class="range-slider" id="fanSpeedSlider">
                </div>
            </div>

            <!-- Master Fan Power Switch Card -->
            <div class="widget-card">
                <div class="switch-row">
                    <div class="switch-label">
                        <span>Fan Master Power</span>
                        <span>Virtual Relay GPIO 2</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="fanPowerToggle">
                        <span class="slider-toggle"></span>
                    </label>
                </div>
            </div>

            <!-- Light Switch Card -->
            <div class="widget-card">
                <div class="switch-row">
                    <div class="switch-label">
                        <span>Smart Room Light</span>
                        <span>Virtual Relay GPIO 4</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="lightPowerToggle">
                        <span class="slider-toggle"></span>
                    </label>
                </div>
            </div>

            <!-- Environmental Sensors Info Grid -->
            <div class="metrics-grid">
                <div class="metric-box">
                    <h4>Room Temp</h4>
                    <p id="tempDisplay">26°C</p>
                </div>
                <div class="metric-box">
                    <h4>Humidity</h4>
                    <p id="humidityDisplay">58%</p>
                </div>
            </div>

        </div>

        <!-- App Footer -->
        <div class="app-footer">
            Powered by Blynk IoT Cloud &bull; Local Proximity Hub
        </div>
    </div>

    <script>
        const fanSpeedSlider = document.getElementById('fanSpeedSlider');
        const speedValue = document.getElementById('speedValue');
        const fanPowerToggle = document.getElementById('fanPowerToggle');
        const fanIndicator = document.getElementById('fanIndicator');
        const fanVisual = document.getElementById('fanVisual');

        function updateFanState() {
            const speed = parseInt(fanSpeedSlider.value);
            speedValue.innerText = speed;

            // Remove existing spin classes
            const blades = [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3')];
            blades.forEach(b => {
                b.className = "fan-blade";
            });

            if (fanPowerToggle.checked && speed > 0) {
                fanIndicator.classList.add('active');
                blades.forEach(b => {
                    b.classList.add(`spinning-${speed}`);
                });
            } else {
                fanIndicator.classList.remove('active');
                if (fanPowerToggle.checked && speed === 0) {
                    fanIndicator.classList.add('active'); // powered on but speed 0
                }
            }
        }

        fanSpeedSlider.addEventListener('input', () => {
            // If slider is moved while power is off, automatically turn power ON for convenience
            if (!fanPowerToggle.checked && parseInt(fanSpeedSlider.value) > 0) {
                fanPowerToggle.checked = true;
            }
            updateFanState();
        });

        fanPowerToggle.addEventListener('change', () => {
            if (!fanPowerToggle.checked) {
                fanSpeedSlider.value = 0;
            } else if (fanSpeedSlider.value == 0) {
                fanSpeedSlider.value = 2; // Default starting speed when turned on
            }
            updateFanState();
        });

        // Initialize state on load
        updateFanState();
    </script>
</body>
</html>
